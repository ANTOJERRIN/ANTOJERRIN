<svg xmlns="http://www.w3.org/2000/svg" width="352" height="325" viewBox="0 0 352 325" role="img" aria-labelledby="title desc">
  <title id="title">Engineering focus and current build</title>
  <desc id="desc">Design for real constraints: verifiable data in AQUA-ETHIC, offline coordination in ResQ. At ForMa, I build products with a developer community and review code with peers.</desc>
  <defs>
    <linearGradient id="background" x2="100%" y2="100%">
      <stop stop-color="#122943"/>
      <stop offset=".68" stop-color="#0C1421"/>
    </linearGradient>
    <pattern id="grid" width="19" height="19" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r=".85" fill="#79CBFF" opacity=".19"/>
    </pattern>
  </defs>
  <rect x=".5" y=".5" width="351" height="324" rx="12" fill="url(#background)" stroke="#2B4561"/>
  <rect x="1" y="1" width="350" height="323" rx="11" fill="url(#grid)"/>
  <path d="M19 1h72" stroke="#79CBFF" stroke-width="2" stroke-linecap="round"/>
  <path d="M98 1h20" stroke="#B4EE78" stroke-width="2" stroke-linecap="round"/>

  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="18" y="28" fill="#8AD0FF" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.1">ENGINEERING FOCUS</text>
    <text x="18" y="56" fill="#F0F6FC" font-size="23" font-weight="700">Design for real constraints</text>
    <text x="18" y="79" fill="#BBCDE0" font-size="14">I build around the conditions the software</text>
    <text x="18" y="98" fill="#BBCDE0" font-size="14">will face in use.</text>

    <rect x="18" y="111" width="316" height="30" rx="6" fill="#15273A" stroke="#2B4561"/>
    <circle cx="31" cy="126" r="3" fill="#79CBFF"/>
    <text x="42" y="131" fill="#F0F6FC" font-size="14" font-weight="600">Verifiable sensor data</text>
    <text x="323" y="131" text-anchor="end" fill="#B8CFE6" font-size="12">AQUA-ETHIC</text>

    <rect x="18" y="148" width="316" height="30" rx="6" fill="#15273A" stroke="#2B4561"/>
    <circle cx="31" cy="163" r="3" fill="#B4EE78"/>
    <text x="42" y="168" fill="#F0F6FC" font-size="14" font-weight="600">Offline coordination</text>
    <text x="323" y="168" text-anchor="end" fill="#B8CFE6" font-size="12">ResQ</text>

    <rect x="18" y="193" width="316" height="114" rx="9" fill="#122035" stroke="#2B4561"/>
    <text x="32" y="216" fill="#B4EE78" font-family="Consolas, monospace" font-size="13" font-weight="700" letter-spacing="1.1">CURRENT BUILD</text>
    <text x="32" y="243" fill="#F0F6FC" font-size="23" font-weight="700">ForMa</text>
    <text x="32" y="265" fill="#BBCDE0" font-size="14">Building products with a developer community.</text>
    <path d="M32 276h288" stroke="#304964"/>
    <text x="32" y="295" fill="#D7E7F7" font-size="14">Collaborative builds · Peer review</text>
  </g>
</svg>
