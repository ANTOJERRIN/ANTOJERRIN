name: Refresh profile stats

on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/profile-stats.yml
      - .github/scripts/profile_stats.py

permissions:
  contents: write

concurrency:
  group: profile-stats

jobs:
  refresh:
    if: github.repository == 'ANTOJERRIN/ANTOJERRIN' && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch GitHub stats and refresh README
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/profile_stats.py
      - name: Commit updated stats
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m 'Refresh profile stats'
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
